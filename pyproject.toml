[project]
name = "vector-pitch"
version = "0.6.0"
description = "MTNN pitch – 633 player-tournaments WC, Vercel static"
readme = "README.md"
requires-python = ">=3.11"
license = {text="MIT"}
authors = [{name="Cam"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.2","pre-commit>=3.5","pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["assets/*","data/*","__pycache__",".venv","dist",".git","api/*"]

[tool.ruff.lint]
select = ["E","W","F","I","B","C4","UP","N","S","PTH","TCH","RUF"]
# N806/N812: allow conventional ML/math variable names (X, W, N, etc.) in function bodies.
ignore = ["S101","S603","S607","N803","N806","N812","E501","E722","S110","RUF001","RUF002","RUF003","S108","S310","S311","UP038","C414"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"assets/*" = ["ALL"]
"pipeline/*" = ["E402","TCH003"]
# Pre-existing debt in files unchanged since master; resumable network fetchers
# keep broad except/S-rule patterns by convention (see fetch_* scripts).
"pipeline/fetch_historical_pitch.py" = ["E501","E722","F401","S110","S310","UP017"]
"operator/mlops_cli.py" = ["E501","E702","F401","I001"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Pre-existing formatting debt in files unchanged since master.
exclude = ["pipeline/fetch_historical_pitch.py","operator/mlops_cli.py"]

[tool.pytest.ini_options]
testpaths = ["tests","pipeline"]
python_files = ["test_*.py"]
addopts = "-q"
